name: Aggiungi Confronto Chandelier Exit

on:
  workflow_dispatch: # Solo manuale — nessun fetch yfinance, gira su dati già committati

permissions:
  contents: write

concurrency:
  group: core-backtest-chandelier
  cancel-in-progress: false

jobs:
  add-chandelier:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggiungi Confronto Chandelier Exit
        run: |
          python scripts/add_chandelier_exit.py

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trades_dataset.json
          git commit -m "Aggiunge confronto Chandelier Exit ai trade [skip ci]" || exit 0
          git pull --rebase origin main
          git push
