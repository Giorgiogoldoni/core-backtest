name: Backtest — TEST su campione ridotto

on:
  workflow_dispatch: # Solo manuale — non entra nello schedule mensile

permissions:
  contents: write

jobs:
  run-backtest-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Esegui Backtest su campione ridotto (25 ticker)
        env:
          LIMIT_TICKERS: '25'
        run: |
          python scripts/backtest_fetch.py

      - name: Commit e Push del dataset di test
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "TEST — dataset trade su campione ridotto [skip ci]" || exit 0
          git pull --rebase origin main
          git push
