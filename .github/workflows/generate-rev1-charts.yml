name: Genera Grafici REV1

on:
  workflow_dispatch: # Solo manuale — nessun fetch yfinance, gira su cache già committata

permissions:
  contents: write

concurrency:
  group: core-backtest-rev1-charts
  cancel-in-progress: false

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Genera Dati Grafico REV1 (solo cache locale)
        run: |
          python scripts/generate_rev1_charts.py

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/charts/
          git commit -m "Aggiorna dati grafico REV1 [skip ci]" || exit 0
          git pull --rebase origin main
          git push
