name: Backtest Storico Universo

on:
  schedule:
    # Esegue il primo giorno di ogni mese alle 03:00 UTC (fascia bassa carico)
    - cron: '0 3 1 * *'
  workflow_dispatch: # Permette l'esecuzione manuale da tab Actions su GitHub

permissions:
  contents: write

concurrency:
  group: core-backtest-pipeline
  cancel-in-progress: false

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Esegui Backtest Storico
        run: |
          python scripts/backtest_fetch.py

      - name: Commit e Push del dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Aggiorna dataset trade storici [skip ci]" || exit 0
          git pull --rebase origin main
          git push
